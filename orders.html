<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>订单列表</title>
</head>
<body>

<h1>订单列表</h1>

<table border="1">
    <tr>
        <th>订单ID</th>
        <th>买家ID</th>
        <th>商品ID</th>
        <th>日期</th>
    </tr>

    {% for order in orders %}
    <tr>
        <td>{{ order.order_id }}</td>
        <td>{{ order.buyer_id }}</td>
        <td>{{ order.item_id }}</td>
        <td>{{ order.order_date }}</td>
    </tr>
    {% endfor %}

</table>

<br>
<a href="/">返回首页</a>

</body>
</html>
